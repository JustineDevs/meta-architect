name: Feature Request
description: Propose a new capability or improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature requests, product improvements, or new repository surfaces.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: Describe the gap, friction, or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Meta-Architect do?
      placeholder: Describe the change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds did you consider?
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: Impact area
      options:
        - architecture workflow
        - skill contracts
        - prompts
        - publishing
        - GitHub automation
        - MCP integration
        - docs
        - developer experience
        - user experience
        - other
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Could this be breaking?
      options:
        - "no"
        - "possibly"
        - "yes"
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How should we know this feature is complete?
      placeholder: Define observable outcomes.
    validations:
      required: false
  - type: input
    id: linked_issues
    attributes:
      label: Linked issues or task contract
      description: Link related issues and describe the contract an implementation must satisfy.
    validations:
      required: false
  - type: textarea
    id: context_privacy
    attributes:
      label: Context and privacy impact
      description: Describe `.ma`, Obsidian, MCP, hook, public-output, secret, or local-path implications.
      placeholder: None, or describe the affected surfaces and freshness requirements.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification evidence
      description: State how the feature will be proven and what evidence should be attached.
      placeholder: Focused test, smoke command, receipt, or conformance fixture.
    validations:
      required: false
  - type: textarea
    id: generated_artifacts
    attributes:
      label: Generated artifacts and release impact
      description: Note `.ma`, package, docs, CI, or other generated output and how it should be verified.
    validations:
      required: false
