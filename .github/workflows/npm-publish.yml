name: NPM Publish

on:
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.12"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Load npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY_URL: "https://registry.npmjs.org/"
          NPM_SCOPE: "@jstn-sdk"
        run: node ./scripts/setup-npmrc.js

      - name: Install dependencies
        run: npm ci

      - name: Verify npm publisher identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Validate package
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: npm run release:check

      - name: Resolve release metadata
        id: release_meta
        run: node ./scripts/release-metadata.js --github-output "$GITHUB_OUTPUT"

      - name: Publish stable package to latest
        if: steps.release_meta.outputs.dist_tag == 'latest'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish prerelease package to explicit dist-tag
        if: steps.release_meta.outputs.dist_tag != 'latest'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${{ steps.release_meta.outputs.dist_tag }}"

      - name: Verify published dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm view @jstn-sdk/ma version dist-tags time --json
