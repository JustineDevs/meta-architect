name: NPM Publish

on:
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.12"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: npm run release:check

      - name: Resolve release metadata
        id: release_meta
        run: node ./scripts/release-metadata.js --github-output "$GITHUB_OUTPUT"

      - name: Check whether npm version is already published
        id: npm_version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@jstn-sdk/ma@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@jstn-sdk/ma@$version already exists on npm; publication will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable package to latest
        if: steps.release_meta.outputs.dist_tag == 'latest' && steps.npm_version.outputs.published != 'true'
        run: npm publish --access public

      - name: Publish prerelease package to explicit dist-tag
        if: steps.release_meta.outputs.dist_tag != 'latest' && steps.npm_version.outputs.published != 'true'
        run: npm publish --access public --tag "${{ steps.release_meta.outputs.dist_tag }}"

      - name: Verify published dist-tags
        run: npm view @jstn-sdk/ma version dist-tags time --json
