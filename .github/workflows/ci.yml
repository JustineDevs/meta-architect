name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check temporary disk capacity
        run: |
          usage=$(df -P /tmp | awk 'NR == 2 {gsub("%", "", $5); print $5}')
          echo "/tmp usage: ${usage}%"
          if [ "$usage" -gt 80 ]; then echo "::warning::/tmp is ${usage}% full"; fi
          if [ "$usage" -gt 95 ]; then echo "::error::/tmp is ${usage}% full"; exit 1; fi

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Verify release metadata alignment
        run: npm run release:verify

      - name: Generate skills manifest
        run: npm run skills:manifest

      - name: Sync plugin mirror
        run: npm run plugin:sync

      - name: Validate skills
        run: npm run skills:validate

      - name: Verify plugin mirror
        run: npm run plugin:verify

      - name: Pack skills bundle
        run: npm run skills:pack

      - name: Smoke test skills install
        run: npm run skills:install -- --path ./dist/installed-skills

      - name: Run code quality checks
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Report and prune temporary fixtures
        if: always()
        run: |
          du -sh /tmp/ma-tests/* 2>/dev/null | sort -hr | head -10 || true
          bash ./scripts/cleanup-test-fixtures.sh

      - name: Upload packaged artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-architect-skills
          path: |
            dist/*.tgz
            skills/index.json
            plugins/meta-architect/.codex-plugin/plugin.json
            .agents/plugins/marketplace.json
          if-no-files-found: ignore

  linux-packages:
    runs-on: ubuntu-latest
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack skills bundle
        run: npm run skills:pack

      - name: Build Linux native packages
        run: npm run linux:packages:build

      - name: Smoke test Linux native packages
        run: npm run linux:packages:smoke

      - name: Validate release asset set
        run: npm run release:assets:generate && npm run release:assets

      - name: Upload Linux release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-architect-linux-release-assets
          path: |
            dist/*.tgz
            dist/*.deb
            dist/*.pkg.tar.xz
            dist/*.rpm
            dist/linux-package-manifest.json
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/release-summary.json
          if-no-files-found: ignore
