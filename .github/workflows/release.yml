name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.15.1"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the tag to point at the production branch
        run: |
          git fetch origin main --quiet
          if [ "${{ github.event_name }}" = "push" ]; then
            test "$(git rev-parse origin/main)" = "${GITHUB_SHA}" || {
              echo "Release tags must point at the current origin/main commit."
              exit 1
            }
          else
            git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main" || {
              echo "Dispatched release tags must point at an ancestor of origin/main."
              exit 1
            }
          fi

      - name: Install Codex CLI for live acceptance
        run: |
          npm install --global @openai/codex@latest
          codex --version

      - name: Run real live regression
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run live:regression -- --output "$RUNNER_TEMP/meta-architect-live-regression.json"

      - name: Upload live regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-architect-live-regression-${{ github.ref_name }}
          path: ${{ runner.temp }}/meta-architect-live-regression.json
          if-no-files-found: error

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Validate release bundle
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run release:check

      - name: Build Linux native packages
        run: npm run linux:packages:build

      - name: Smoke test Linux native packages
        run: npm run linux:packages:smoke

      - name: Remove plugin build staging output
        run: rm -rf dist/vendor-plugins

      - name: Generate release checksums and SBOM
        run: npm run release:assets:generate

      - name: Validate release assets
        run: npm run release:assets

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/meta-architect-skills.tgz
            dist/*.deb
            dist/*.pkg.tar.xz
            dist/*.rpm
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/release-summary.json
          body_path: RELEASE.md
