name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Load npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_SCOPE: "@jstn-sdk"
          NPM_REGISTRY_URL: "https://registry.npmjs.org/"
        run: node ./scripts/setup-npmrc.js

      - name: Install dependencies
        run: npm ci

      - name: Verify skills manifest is current
        run: |
          npm run skills:manifest
          git diff --exit-code skills/index.json

      - name: Validate skills
        run: npm run skills:validate

      - name: Enforce PR base branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "development" ]; then
            echo "Normal integration PR targeting development: allowed."
            exit 0
          fi

          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "development" ]; then
            echo "Curated promotion PR from development to main: allowed."
            exit 0
          fi

          echo "Invalid PR target policy."
          echo "Normal PRs must target development."
          echo "Only curated promotion PRs from development may target main."
          echo "Current head: $HEAD_REF"
          echo "Current base: $BASE_REF"
          exit 1

      - name: Fail on forbidden tracked runtime .omx files
        run: |
          forbidden=$(git ls-files '.omx/logs/*' '.omx/state/*' '.omx/tmp/*' '.omx/cache/*' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden runtime .omx files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Check release docs when package version changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^package.json$'; then
            changed=$(git diff origin/${{ github.base_ref }}...HEAD -- package.json)
            if echo "$changed" | grep -q '"version"'; then
              files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
              echo "$files" | grep -q '^RELEASE.md$' || (echo "RELEASE.md must be updated when version changes" && exit 1)
            fi
          fi
