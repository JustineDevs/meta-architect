name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Load npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY_URL: "https://registry.npmjs.org/"
        run: node ./scripts/setup-npmrc.js

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata alignment
        run: npm run release:verify

      - name: Verify skills manifest is current
        run: |
          npm run skills:manifest
          git diff --exit-code skills/index.json

      - name: Verify plugin mirror is current
        run: |
          npm run plugin:sync
          git diff --exit-code plugins/meta-architect

      - name: Validate skills
        run: npm run skills:validate

      - name: Verify plugin mirror
        run: npm run plugin:verify

      - name: Enforce PR base branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "dev" ]; then
            echo "Normal integration PR targeting dev: allowed."
            exit 0
          fi

          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "development" ]; then
            echo "Curated promotion PR from development to main: allowed."
            exit 0
          fi

          echo "Invalid PR target policy."
          echo "Normal PRs must target dev."
          echo "Only curated promotion PRs from dev may target main."
          echo "Current head: $HEAD_REF"
          echo "Current base: $BASE_REF"
          exit 1

      - name: Fail on forbidden tracked runtime .ma files
        run: |
          forbidden=$(git ls-files '.ma/logs/*' '.ma/state/*' '.ma/tmp/*' '.ma/cache/*' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden runtime .ma files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Remove temporary npm auth config
        if: always()
        run: rm -f -- "${NPM_CONFIG_USERCONFIG:-}"
