name: Promote Dev To Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: true

jobs:
  promotion:
    name: Open production promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing already open."
            pr_number="$existing"
          else
            body="$(printf '%s\n\n%s\n' \
              'Automated promotion PR from dev to main.' \
              'All required CI, security, package, and review checks must pass before this production promotion is merged.')"

            if gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dev \
              --title "chore(release): promote dev to main" \
              --body "$body"; then
              pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')
            else
              pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')
              if [ -z "$pr_number" ]; then
                echo "Unable to create the promotion PR. Configure the one-time RELEASE_BOT_TOKEN repository secret or permit Actions to create pull requests." >&2
                exit 1
              fi
            fi
          fi

          echo "Promotion PR #$pr_number is ready. Queueing auto-merge when repository policy allows it."
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$pr_number" || \
            echo "Auto-merge is waiting for the repository's required review/signature policy."
