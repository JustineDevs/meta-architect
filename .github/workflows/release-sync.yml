name: Release Sync

on:
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - "docs/**"
      - "example/**"
      - "mcp/**"
      - "missions/**"
      - "plugins/**"
      - "prompts/**"
      - ".codex/prompts/**"
      - "sprint/**"
      - "templates/**"
      - "src/**"
      - "skills/**"
  workflow_dispatch:

jobs:
  sync-release-line:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run release sync
        id: sync
        run: node ./scripts/release-sync.js --from-ref "${{ github.event.before }}" --to-ref "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

      - name: Create release-sync PR
        if: steps.sync.outputs.updated == 'true'
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(release): sync release line to v${{ steps.sync.outputs.version }}"
          branch: "automation/release-sync-v${{ steps.sync.outputs.version }}"
          delete-branch: true
          title: "chore(release): sync release line to v${{ steps.sync.outputs.version }}"
          body: |
            Automated release-line sync for watched release-relevant changes on `main`.

            This PR was generated by `scripts/release-sync.js`.
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
            README.md
            RELEASE.md
            docs/README.md
            docs/getting-started.md
            docs/release-spec.md
            docs/qa/**
            plugins/meta-architect/README.md
            plugins/meta-architect/.app.json
            plugins/meta-architect/.mcp.json
            plugins/meta-architect/.codex-plugin/plugin.json
            src/skills.js
            src/mcp-live-client.js
            test/package-install-smoke.test.js
            test/policy.test.js

      - name: Enable auto-merge for release-sync PR
        if: steps.sync.outputs.updated == 'true' && steps.cpr.outcome == 'success' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"

      - name: Report release-sync PR policy block
        if: steps.sync.outputs.updated == 'true' && steps.cpr.outcome != 'success'
        run: |
          echo "Release-sync changes were generated, but GitHub Actions is not permitted to create pull requests in this repository."
          echo "The workflow completed without failing so branch protection is not blocked by repo policy."
