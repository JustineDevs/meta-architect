name: Auto Tag Production Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-tag-production-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version from main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Resolve release version
        id: release_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Create or verify the release tag
        env:
          RELEASE_REMOTE: origin
        run: node ./scripts/auto-release-tag.mjs

      - name: Dispatch release workflow for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.release_version.outputs.version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"
