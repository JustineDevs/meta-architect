name: Codex Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Verify ChatGPT Codex Connector participation
        uses: actions/github-script@v9
        env:
          CODEX_REVIEW_APP_SLUG: chatgpt-codex-connector
          CODEX_REVIEW_BOT_LOGINS: chatgpt-codex-connector[bot],app/chatgpt-codex-connector
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const appSlug = (process.env.CODEX_REVIEW_APP_SLUG || "chatgpt-codex-connector").toLowerCase();
            const botLogins = (process.env.CODEX_REVIEW_BOT_LOGINS || "")
              .split(",")
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean);

            const expectedLogins = new Set([appSlug, ...botLogins]);

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            });

            const matchingChecks = checkRuns.filter((run) => {
              const slug = run.app?.slug?.toLowerCase();
              return slug === appSlug;
            });

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            const reviewEvents = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const matchingComments = issueComments.filter((comment) => {
              const login = comment.user?.login?.toLowerCase();
              return login && expectedLogins.has(login);
            });

            const matchingReviews = reviewEvents.filter((review) => {
              const login = review.user?.login?.toLowerCase();
              return login && expectedLogins.has(login);
            });

            const matched = matchingChecks.length > 0 || matchingComments.length > 0 || matchingReviews.length > 0;

            core.summary
              .addHeading("Codex review evidence")
              .addRaw(`App slug checked: \`${appSlug}\`\n\n`)
              .addRaw(`Matching check runs: ${matchingChecks.length}\n\n`)
              .addRaw(`Matching issue comments: ${matchingComments.length}\n\n`)
              .addRaw(`Matching review events: ${matchingReviews.length}\n\n`);

            if (matchingChecks.length > 0) {
              core.summary.addHeading("Check runs", 2);
              for (const run of matchingChecks) {
                core.summary.addRaw(`- ${run.name} (${run.status}/${run.conclusion ?? "pending"})\n`);
              }
              core.summary.addRaw("\n");
            }

            if (matchingComments.length > 0) {
              core.summary.addHeading("Issue comments", 2);
              for (const comment of matchingComments) {
                core.summary.addRaw(`- ${comment.user.login} at ${comment.created_at}\n`);
              }
              core.summary.addRaw("\n");
            }

            if (matchingReviews.length > 0) {
              core.summary.addHeading("Review events", 2);
              for (const review of matchingReviews) {
                core.summary.addRaw(`- ${review.user.login} (${review.state}) at ${review.submitted_at}\n`);
              }
              core.summary.addRaw("\n");
            }

            await core.summary.write();

            if (!matched) {
              core.setFailed(
                "No observable ChatGPT Codex Connector evidence was found on this pull request. Require the connector to leave a check run, issue comment, or review event before merge."
              );
            }
