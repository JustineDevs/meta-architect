name: Release Advance

on:
  release:
    types:
      - published
      - prereleased

jobs:
  advance-release-line:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Advance release line
        id: advance
        run: node ./scripts/release-sync.js --force --bump patch --github-output "$GITHUB_OUTPUT"

      - name: Create release-advance PR
        if: steps.advance.outputs.updated == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(release): advance release line to v${{ steps.advance.outputs.version }}"
          branch: "automation/release-advance-v${{ steps.advance.outputs.version }}"
          delete-branch: true
          title: "chore(release): advance release line to v${{ steps.advance.outputs.version }}"
          body: |
            Automated post-publish advance to the next patch release line.

            This PR was generated by `scripts/release-sync.js --force --bump patch`.
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
            README.md
            RELEASE.md
            docs/README.md
            docs/getting-started.md
            docs/release-spec.md
            docs/qa/**
            plugins/meta-architect/README.md
            plugins/meta-architect/.app.json
            plugins/meta-architect/.mcp.json
            plugins/meta-architect/.codex-plugin/plugin.json
            src/skills.js
            src/mcp-live-client.js
            test/package-install-smoke.test.js
            test/policy.test.js

      - name: Enable auto-merge for release-advance PR
        if: steps.advance.outputs.updated == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
