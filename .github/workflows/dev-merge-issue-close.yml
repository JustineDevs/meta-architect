name: Close Issues On Development Merge

on:
  pull_request:
    types:
      - closed

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close linked issues from PR body
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const matches = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(matches.map((match) => Number(match[1])))]
              .filter((value) => Number.isInteger(value));

            if (issueNumbers.length === 0) {
              core.info("No linked issues found in PR body.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              core.info(`Closing issue #${issueNumber}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: "closed",
              });
            }
