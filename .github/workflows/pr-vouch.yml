name: PR Vouch

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  vouch:
    name: Verify contributor trust
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate repository trust list
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = context.payload.pull_request.user.login.toLowerCase();
            const trustFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/VOUCHED.md",
              ref: context.payload.pull_request.base.sha,
            });

            const source = Buffer.from(trustFile.data.content, "base64").toString("utf8");
            const trusted = new Set();
            const denounced = new Map();
            for (const rawLine of source.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;
              if (line.startsWith("-github:")) {
                const value = line.slice("-github:".length).trim();
                const [login, ...reason] = value.split(/\s+/);
                if (login) denounced.set(login.toLowerCase(), reason.join(" ") || "denounced");
                continue;
              }
              if (line.startsWith("github:")) {
                const login = line.slice("github:".length).trim().split(/\s+/)[0];
                if (login) trusted.add(login.toLowerCase());
              }
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: author,
            }).then((response) => response.data.permission).catch(() => "none");

            const collaboratorTrusted = ["admin", "maintain", "push", "write"].includes(permission);
            const explicitlyTrusted = trusted.has(author);
            const explicitlyDenied = denounced.get(author);
            const allowed = !explicitlyDenied && (collaboratorTrusted || explicitlyTrusted);

            core.summary
              .addHeading("PR vouch")
              .addRaw(`Contributor: \`${author}\`\n\n`)
              .addRaw(`Repository permission: \`${permission}\`\n\n`)
              .addRaw(`Trust-list entry: ${explicitlyTrusted ? "yes" : "no"}\n\n`)
              .addRaw(`Decision: ${allowed ? "trusted" : "untrusted"}\n\n`);
            if (explicitlyDenied) core.summary.addRaw(`Denouncement: ${explicitlyDenied}\n\n`);
            await core.summary.write();

            if (!allowed) {
              core.setFailed("Contributor is not vouched. Add github:<username> to .github/VOUCHED.md or review the pull request manually.");
            }
